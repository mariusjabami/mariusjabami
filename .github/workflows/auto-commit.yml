name: Auto Commit

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 11 * * *'
    - cron: '0 14 * * *'
    - cron: '0 17 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update timestamp file
        run: date -u > .last-update

      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions-bot@users.noreply.github.com
          git add .last-update
          git commit -m auto-update-$(date -u +%Y%m%d%H%M) || true
          git push